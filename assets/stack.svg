<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 390" width="890" height="390" fill="none">
  <defs>
    <linearGradient id="stack-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff354f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="stack-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#247bff" fill-opacity="0.12"/>
    </pattern>
    <radialGradient id="stack-orbit-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .stack-bg { fill: #070b16; }
    .stack-font { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    /* Orbital Rotations */
    @keyframes stack-orbit-cw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes stack-orbit-ccw {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes stack-core-pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(36,123,255,0.6)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 24px rgba(255,53,79,0.8)); }
    }

    .stack-orbit-1 { animation: stack-orbit-cw 20s linear infinite; transform-origin: 215px 230px; }
    .stack-orbit-2 { animation: stack-orbit-ccw 28s linear infinite; transform-origin: 215px 230px; }
    .stack-orbit-3 { animation: stack-orbit-cw 36s linear infinite; transform-origin: 215px 230px; }
    .stack-core { animation: stack-core-pulse 3s ease-in-out infinite; transform-origin: 215px 230px; }

    /* Counter-rotate icon glyphs so they stay upright */
    .stack-node-1 { animation: stack-orbit-ccw 20s linear infinite; }
    .stack-node-2 { animation: stack-orbit-cw 28s linear infinite; }
    .stack-node-3 { animation: stack-orbit-ccw 36s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .stack-orbit-1, .stack-orbit-2, .stack-orbit-3, .stack-core,
      .stack-node-1, .stack-node-2, .stack-node-3 {
        animation: none !important;
      }
    }
  </style>

  <!-- Background -->
  <rect width="890" height="390" rx="16" class="stack-bg"/>
  <rect width="890" height="390" rx="16" fill="url(#stack-dots)"/>
  <rect x="1" y="1" width="888" height="388" rx="15" fill="none" stroke="url(#stack-border-grad)" stroke-width="1.5"/>

  <!-- Header -->
  <g class="stack-font" transform="translate(48, 42)">
    <rect width="100" height="22" rx="6" fill="#0d1b33" stroke="#247bff" stroke-opacity="0.4" stroke-width="1"/>
    <text x="12" y="15" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">TECH STACK</text>
    <text x="115" y="16" fill="#ffffff" font-size="20" font-weight="800">Technologies &amp; Engineering Toolkit</text>
  </g>

  <!-- Left: 3 Tilted Elliptical Planetary Orbits (Center: 215, 230) -->
  <g class="stack-font">
    <!-- Ambient Orbit Glow -->
    <circle cx="215" cy="230" r="140" fill="url(#stack-orbit-glow)"/>

    <!-- Orbit 3 (Outer, rx=160, ry=70, tilt: -12 deg) -->
    <ellipse cx="215" cy="230" rx="160" ry="70" transform="rotate(-12 215 230)" fill="none" stroke="#247bff" stroke-opacity="0.25" stroke-dasharray="6 6" stroke-width="1.2"/>
    <g class="stack-orbit-3">
      <!-- MongoDB on Orbit 3 (angle 0) -->
      <g transform="translate(370, 220)">
        <g class="stack-node-3" transform-origin="12 12">
          <circle cx="12" cy="12" r="14" fill="#0a1826" stroke="#47a248" stroke-width="1.5"/>
          <text x="12" y="16" fill="#47a248" font-size="10" font-weight="900" text-anchor="middle">🍃</text>
        </g>
      </g>
      <!-- Tailwind CSS on Orbit 3 (angle 120) -->
      <g transform="translate(135, 290)">
        <g class="stack-node-3" transform-origin="12 12">
          <circle cx="12" cy="12" r="14" fill="#081e2b" stroke="#06b6d4" stroke-width="1.5"/>
          <text x="12" y="16" fill="#06b6d4" font-size="10" font-weight="900" text-anchor="middle">🌊</text>
        </g>
      </g>
      <!-- Express on Orbit 3 (angle 240) -->
      <g transform="translate(135, 170)">
        <g class="stack-node-3" transform-origin="12 12">
          <circle cx="12" cy="12" r="14" fill="#1e1e24" stroke="#ffffff" stroke-width="1.5"/>
          <text x="12" y="16" fill="#ffffff" font-size="10" font-weight="900" text-anchor="middle">Ex</text>
        </g>
      </g>
    </g>

    <!-- Orbit 2 (Middle, rx=115, ry=50, tilt: 22 deg) -->
    <ellipse cx="215" cy="230" rx="115" ry="50" transform="rotate(22 215 230)" fill="none" stroke="#ff354f" stroke-opacity="0.3" stroke-dasharray="5 5" stroke-width="1.2"/>
    <g class="stack-orbit-2">
      <!-- React on Orbit 2 -->
      <g transform="translate(320, 240)">
        <g class="stack-node-2" transform-origin="12 12">
          <circle cx="12" cy="12" r="14" fill="#082338" stroke="#61dafb" stroke-width="1.5"/>
          <text x="12" y="16" fill="#61dafb" font-size="10" font-weight="900" text-anchor="middle">⚛</text>
        </g>
      </g>
      <!-- Next.js on Orbit 2 -->
      <g transform="translate(110, 220)">
        <g class="stack-node-2" transform-origin="12 12">
          <circle cx="12" cy="12" r="14" fill="#070b16" stroke="#ffffff" stroke-width="1.5"/>
          <text x="12" y="16" fill="#ffffff" font-size="10" font-weight="900" text-anchor="middle">N</text>
        </g>
      </g>
      <!-- TypeScript on Orbit 2 -->
      <g transform="translate(215, 175)">
        <g class="stack-node-2" transform-origin="12 12">
          <circle cx="12" cy="12" r="14" fill="#0b1b36" stroke="#3178c6" stroke-width="1.5"/>
          <text x="12" y="16" fill="#3178c6" font-size="10" font-weight="900" text-anchor="middle">TS</text>
        </g>
      </g>
      <!-- Node.js on Orbit 2 -->
      <g transform="translate(215, 280)">
        <g class="stack-node-2" transform-origin="12 12">
          <circle cx="12" cy="12" r="14" fill="#0f2613" stroke="#5fa04e" stroke-width="1.5"/>
          <text x="12" y="16" fill="#5fa04e" font-size="10" font-weight="900" text-anchor="middle">JS</text>
        </g>
      </g>
    </g>

    <!-- Orbit 1 (Inner, rx=70, ry=32, tilt: -18 deg) -->
    <ellipse cx="215" cy="230" rx="70" ry="32" transform="rotate(-18 215 230)" fill="none" stroke="#00d4ff" stroke-opacity="0.35" stroke-dasharray="4 4" stroke-width="1.2"/>
    <g class="stack-orbit-1">
      <!-- C++ on Orbit 1 -->
      <g transform="translate(275, 215)">
        <g class="stack-node-1" transform-origin="12 12">
          <circle cx="12" cy="12" r="13" fill="#071e3d" stroke="#00599c" stroke-width="1.5"/>
          <text x="12" y="16" fill="#61dafb" font-size="9" font-weight="900" text-anchor="middle">C++</text>
        </g>
      </g>
      <!-- Python on Orbit 1 -->
      <g transform="translate(155, 240)">
        <g class="stack-node-1" transform-origin="12 12">
          <circle cx="12" cy="12" r="13" fill="#1b2838" stroke="#3776ab" stroke-width="1.5"/>
          <text x="12" y="16" fill="#fcd34d" font-size="9" font-weight="900" text-anchor="middle">Py</text>
        </g>
      </g>
    </g>

    <!-- Center Nucleus Core -->
    <g class="stack-core">
      <circle cx="215" cy="230" r="24" fill="#0f1f3d" stroke="#247bff" stroke-width="2"/>
      <text x="215" y="235" fill="#38bdf8" font-size="13" font-weight="900" text-anchor="middle">&lt;/&gt;</text>
    </g>
  </g>

  <!-- Right: Grouped Stack Chips (3 Category Sections) -->
  <g class="stack-font" transform="translate(450, 85)">
    <!-- Group 1: Languages -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="0.5">LANGUAGES</text>
      <g transform="translate(0, 12)">
        <!-- C -->
        <g transform="translate(0, 0)">
          <rect width="52" height="28" rx="8" fill="#0d1b33" stroke="#247bff" stroke-opacity="0.3" stroke-width="1"/>
          <text x="26" y="18" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">C</text>
        </g>
        <!-- C++ -->
        <g transform="translate(60, 0)">
          <rect width="64" height="28" rx="8" fill="#0d1b33" stroke="#00599c" stroke-opacity="0.6" stroke-width="1"/>
          <text x="32" y="18" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">C++</text>
        </g>
        <!-- Python -->
        <g transform="translate(132, 0)">
          <rect width="80" height="28" rx="8" fill="#0d1b33" stroke="#3776ab" stroke-opacity="0.6" stroke-width="1"/>
          <text x="40" y="18" fill="#fcd34d" font-size="12" font-weight="700" text-anchor="middle">Python</text>
        </g>
        <!-- JavaScript -->
        <g transform="translate(220, 0)">
          <rect width="98" height="28" rx="8" fill="#0d1b33" stroke="#f7df1e" stroke-opacity="0.5" stroke-width="1"/>
          <text x="49" y="18" fill="#fef08a" font-size="12" font-weight="700" text-anchor="middle">JavaScript</text>
        </g>
        <!-- TypeScript -->
        <g transform="translate(326, 0)">
          <rect width="70" height="28" rx="8" fill="#0d1b33" stroke="#3178c6" stroke-opacity="0.6" stroke-width="1"/>
          <text x="35" y="18" fill="#60a5fa" font-size="12" font-weight="700" text-anchor="middle">TypeScript</text>
        </g>
      </g>
    </g>

    <!-- Group 2: Web & Frameworks -->
    <g transform="translate(0, 85)">
      <text x="0" y="0" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="0.5">WEB &amp; FRAMEWORKS</text>
      <g transform="translate(0, 12)">
        <!-- React -->
        <g transform="translate(0, 0)">
          <rect width="72" height="28" rx="8" fill="#0d1b33" stroke="#61dafb" stroke-opacity="0.5" stroke-width="1"/>
          <text x="36" y="18" fill="#61dafb" font-size="12" font-weight="700" text-anchor="middle">React</text>
        </g>
        <!-- Next.js -->
        <g transform="translate(80, 0)">
          <rect width="76" height="28" rx="8" fill="#0d1b33" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
          <text x="38" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Next.js</text>
        </g>
        <!-- Node.js -->
        <g transform="translate(164, 0)">
          <rect width="78" height="28" rx="8" fill="#0d1b33" stroke="#5fa04e" stroke-opacity="0.5" stroke-width="1"/>
          <text x="39" y="18" fill="#86efac" font-size="12" font-weight="700" text-anchor="middle">Node.js</text>
        </g>
        <!-- Express.js -->
        <g transform="translate(250, 0)">
          <rect width="84" height="28" rx="8" fill="#0d1b33" stroke="#94a3b8" stroke-opacity="0.5" stroke-width="1"/>
          <text x="42" y="18" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">Express.js</text>
        </g>
        <!-- Tailwind CSS -->
        <g transform="translate(0, 36)">
          <rect width="112" height="28" rx="8" fill="#0d1b33" stroke="#06b6d4" stroke-opacity="0.5" stroke-width="1"/>
          <text x="56" y="18" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Tailwind CSS</text>
        </g>
      </g>
    </g>

    <!-- Group 3: Data, Tools & Platforms -->
    <g transform="translate(0, 195)">
      <text x="0" y="0" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="0.5">DATA &amp; INFRASTRUCTURE</text>
      <g transform="translate(0, 12)">
        <!-- MongoDB -->
        <g transform="translate(0, 0)">
          <rect width="90" height="28" rx="8" fill="#0d1b33" stroke="#47a248" stroke-opacity="0.6" stroke-width="1"/>
          <text x="45" y="18" fill="#4ade80" font-size="12" font-weight="700" text-anchor="middle">MongoDB</text>
        </g>
        <!-- Git -->
        <g transform="translate(98, 0)">
          <rect width="56" height="28" rx="8" fill="#0d1b33" stroke="#f05032" stroke-opacity="0.6" stroke-width="1"/>
          <text x="28" y="18" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">Git</text>
        </g>
        <!-- GitHub -->
        <g transform="translate(162, 0)">
          <rect width="80" height="28" rx="8" fill="#0d1b33" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
          <text x="40" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">GitHub</text>
        </g>
        <!-- Cloudinary -->
        <g transform="translate(250, 0)">
          <rect width="96" height="28" rx="8" fill="#0d1b33" stroke="#3448c5" stroke-opacity="0.6" stroke-width="1"/>
          <text x="48" y="18" fill="#93c5fd" font-size="12" font-weight="700" text-anchor="middle">Cloudinary</text>
        </g>
        <!-- Vercel -->
        <g transform="translate(354, 0)">
          <rect width="70" height="28" rx="8" fill="#0d1b33" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
          <text x="35" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Vercel</text>
        </g>
      </g>
    </g>
  </g>
</svg>