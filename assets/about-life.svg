<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 430" width="890" height="430" fill="none">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="about-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff354f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Passion Card Border Gradient -->
    <linearGradient id="about-passion-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Subtle Dots Pattern -->
    <pattern id="about-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#247bff" fill-opacity="0.10"/>
    </pattern>

    <!-- Background Radial Glows -->
    <radialGradient id="about-glow-top" cx="20%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="about-glow-bottom" cx="80%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#ff354f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="passion-glow" cx="15%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#091224" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .about-bg { fill: #070b16; }
    .about-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Base Card Background -->
  <rect width="890" height="430" rx="16" class="about-bg"/>
  <rect width="890" height="430" rx="16" fill="url(#about-dots)"/>
  <rect width="890" height="430" rx="16" fill="url(#about-glow-top)"/>
  <rect width="890" height="430" rx="16" fill="url(#about-glow-bottom)"/>
  <rect x="1" y="1" width="888" height="428" rx="15" fill="none" stroke="url(#about-border-grad)" stroke-width="1.5"/>

  <!-- Section Header -->
  <g class="about-font" transform="translate(48, 38)">
    <rect width="88" height="24" rx="6" fill="#0d1b33" stroke="#247bff" stroke-opacity="0.4" stroke-width="1"/>
    <text x="12" y="16.5" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">ABOUT ME</text>
    <text x="104" y="18.5" fill="#ffffff" font-size="20" font-weight="800">Who I Am &amp; What I Build</text>
  </g>

  <!-- TOP ROW: 3 Large Focus Cards -->
  <g class="about-font" transform="translate(48, 80)">
    
    <!-- CARD 1: Full-Stack Web Development -->
    <g transform="translate(0, 0)">
      <rect width="254" height="166" rx="12" fill="#0b1325" stroke="#1e293b" stroke-width="1"/>
      <rect width="254" height="166" rx="12" fill="none" stroke="#247bff" stroke-opacity="0.3" stroke-width="1"/>
      <rect x="16" y="1" width="64" height="2.5" rx="1" fill="#00d4ff"/>

      <!-- Icon & Title -->
      <circle cx="32" cy="30" r="15" fill="#0f2347"/>
      <path d="M26 27 L22 30 L26 33 M38 27 L42 30 L38 33 M35 25 L29 35" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="27" fill="#f8fafc" font-size="14.5" font-weight="700">Full-Stack Dev</text>
      <text x="56" y="42" fill="#38bdf8" font-size="11" font-weight="600">Next.js • React • Node • Mongo</text>

      <!-- Description (Larger font, human phrasing) -->
      <text x="16" y="74" fill="#cbd5e1" font-size="13" line-height="20">
        <tspan x="16" dy="0">Building complete, production-ready</tspan>
        <tspan x="16" dy="20">web apps. Creator of OutRenz,</tspan>
        <tspan x="16" dy="20">handling everything from responsive</tspan>
        <tspan x="16" dy="20">frontend UX to backend API logic.</tspan>
      </text>
    </g>

    <!-- CARD 2: Problem Solving & DSA -->
    <g transform="translate(270, 0)">
      <rect width="254" height="166" rx="12" fill="#0b1325" stroke="#1e293b" stroke-width="1"/>
      <rect width="254" height="166" rx="12" fill="none" stroke="#ff354f" stroke-opacity="0.3" stroke-width="1"/>
      <rect x="16" y="1" width="64" height="2.5" rx="1" fill="#ff354f"/>

      <!-- Icon & Title -->
      <circle cx="32" cy="30" r="15" fill="#331422"/>
      <path d="M25 25 L30 30 L25 35 M32 35 L39 35" stroke="#ff354f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="27" fill="#f8fafc" font-size="14.5" font-weight="700">DSA &amp; Algorithms</text>
      <text x="56" y="42" fill="#ff7589" font-size="11" font-weight="600">C++ • LeetCode • Optimization</text>

      <!-- Description (Larger font, human phrasing) -->
      <text x="16" y="74" fill="#cbd5e1" font-size="13" line-height="20">
        <tspan x="16" dy="0">Daily problem solving in C++</tspan>
        <tspan x="16" dy="20">focused on data structures,</tspan>
        <tspan x="16" dy="20">dynamic programming, trees, graphs,</tspan>
        <tspan x="16" dy="20">and optimal computational trade-offs.</tspan>
      </text>
    </g>

    <!-- CARD 3: Applied AI & Practical Systems -->
    <g transform="translate(540, 0)">
      <rect width="254" height="166" rx="12" fill="#0b1325" stroke="#1e293b" stroke-width="1"/>
      <rect width="254" height="166" rx="12" fill="none" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1"/>
      <rect x="16" y="1" width="64" height="2.5" rx="1" fill="#c084fc"/>

      <!-- Icon & Title -->
      <circle cx="32" cy="30" r="15" fill="#25123d"/>
      <path d="M32 22 L34 28 L40 30 L34 32 L32 38 L30 32 L24 30 L30 28 Z" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="56" y="27" fill="#f8fafc" font-size="14.5" font-weight="700">Applied AI &amp; Systems</text>
      <text x="56" y="42" fill="#d8b4fe" font-size="11" font-weight="600">Python • APIs • Spatial Models</text>

      <!-- Description (Larger font, human phrasing) -->
      <text x="16" y="74" fill="#cbd5e1" font-size="13" line-height="20">
        <tspan x="16" dy="0">Integrating intelligent tools &amp; APIs</tspan>
        <tspan x="16" dy="20">into practical applications. Built</tspan>
        <tspan x="16" dy="20">RainGuard for real-time flood &amp;</tspan>
        <tspan x="16" dy="20">geospatial hazard route mapping.</tspan>
      </text>
    </g>

  </g>

  <!-- BOTTOM ROW: Passion & Focus Card (Spacious, clean, no cluttered badge pills) -->
  <g class="about-font" transform="translate(48, 262)">
    <!-- Container Box -->
    <rect width="794" height="136" rx="14" fill="#091224" stroke="url(#about-passion-border)" stroke-width="1.2"/>
    <rect width="794" height="136" rx="14" fill="url(#about-dots)"/>
    <rect width="794" height="136" rx="14" fill="url(#passion-glow)"/>

    <!-- Header -->
    <g transform="translate(24, 24)">
      <rect width="134" height="22" rx="11" fill="#0d1b33" stroke="#247bff" stroke-opacity="0.5" stroke-width="1"/>
      <text x="14" y="15" fill="#38bdf8" font-size="10.5" font-weight="700" letter-spacing="0.8">PASSION &amp; FOCUS</text>
      <text x="148" y="16" fill="#f8fafc" font-size="15.5" font-weight="700">Engineering With Curiosity, Discipline &amp; Real Purpose</text>
    </g>

    <!-- Narrative (Clean, confident, readable human developer bio) -->
    <text x="24" y="74" fill="#cbd5e1" font-size="14" line-height="24">
      <tspan x="24" dy="0">I'm a B.Tech Computer Science student at MIT-WPU who genuinely loves engineering and building useful things.</tspan>
      <tspan x="24" dy="24">Whether it's shipping platforms like OutRenz, sharpening algorithmic problem-solving in C++, or exploring AI workflows,</tspan>
      <tspan x="24" dy="24">I focus on writing clean, scalable code, understanding how systems work under the hood, and continuous learning.</tspan>
    </text>
  </g>
</svg>